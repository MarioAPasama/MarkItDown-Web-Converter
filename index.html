<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkItDown Web Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            transform: translateY(-5px);
        }

        .upload-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-info {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            align-items: center;
            justify-content: space-between;
        }
        
        .file-info.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        .file-name {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remove-file {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .remove-file:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Convert Button */
        .btn-convert {
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #2563eb 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-convert:hover {
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
        }

        .btn-convert:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        /* Result Area */
        .result-container {
            display: none;
            animation: slideUp 0.6s ease-out;
        }

        .result-container.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .btn-action {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action:hover {
            background: rgba(255,255,255,0.2);
        }

        .result-box {
            width: 100%;
            min-height: 300px;
            max-height: 500px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            color: #e2e8f0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            resize: vertical;
        }

        /* Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3); 
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MarkItDown</h1>
            <p class="subtitle">Beautifully simple document conversion. Transform your PDF, Word, Excel, and PowerPoint files into clean Markdown instantly.</p>
        </header>

        <main class="glass-panel">
            <div class="upload-area" id="drop-area">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <div class="upload-text">Drag & Drop your file here</div>
                <div class="upload-hint">Supports PDF, DOCX, XLSX, PPTX, HTML, Images, etc.</div>
                <input type="file" id="file-input" name="file">
            </div>

            <div class="file-info" id="file-info">
                <div class="file-name">
                    <i class="fa-solid fa-file-lines text-primary"></i>
                    <span id="file-name-text">filename.pdf</span>
                </div>
                <button class="remove-file" id="remove-file" title="Remove file">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="btn-convert" id="btn-convert" disabled>
                <span>Convert to Markdown</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </main>

        <section class="glass-panel result-container" id="result-container">
            <div class="result-header">
                <div class="result-title">Result</div>
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn-action" id="btn-copy">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                    <button class="btn-action" id="btn-download">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                </div>
            </div>
            <textarea class="result-box" id="result-box" readonly></textarea>
        </section>
    </div>

    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" id="toast-icon"></i>
        <span id="toast-msg">Success!</span>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileNameText = document.getElementById('file-name-text');
        const removeFileBtn = document.getElementById('remove-file');
        const btnConvert = document.getElementById('btn-convert');
        const spinner = document.getElementById('spinner');
        const resultContainer = document.getElementById('result-container');
        const resultBox = document.getElementById('result-box');
        const btnCopy = document.getElementById('btn-copy');
        const btnDownload = document.getElementById('btn-download');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');

        let currentFile = null;

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop area
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
        });

        // Handle dropped files
        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        // Handle file input change
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                currentFile = files[0];
                fileNameText.textContent = currentFile.name;
                fileInfo.classList.add('active');
                btnConvert.disabled = false;
                resultContainer.classList.remove('active');
            }
        }

        removeFileBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('active');
            btnConvert.disabled = true;
            resultContainer.classList.remove('active');
        });

        // Convert Button Click
        btnConvert.addEventListener('click', async () => {
            if (!currentFile) return;

            // UI Loading state
            btnConvert.disabled = true;
            spinner.style.display = 'block';
            btnConvert.querySelector('span').textContent = 'Converting...';
            resultContainer.classList.remove('active');

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('upload.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && !data.error) {
                    resultBox.value = data.markdown;
                    resultContainer.classList.add('active');
                    showToast('Conversion successful!', 'success');
                    
                    // Smooth scroll to result
                    setTimeout(() => {
                        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 100);
                } else {
                    let err = data.error || data.markdown || 'Conversion failed';
                    // Sometime python errors are printed into markdown result by mistake, but we handle it.
                    if (data.markdown && data.markdown.toLowerCase().includes('error')) {
                        err = data.markdown;
                    }
                    showToast(err, 'error');
                }
            } catch (error) {
                showToast('An error occurred during conversion.', 'error');
                console.error(error);
            } finally {
                // Restore UI state
                btnConvert.disabled = false;
                spinner.style.display = 'none';
                btnConvert.querySelector('span').textContent = 'Convert to Markdown';
            }
        });

        // Copy to clipboard
        btnCopy.addEventListener('click', () => {
            resultBox.select();
            document.execCommand('copy');
            showToast('Copied to clipboard!', 'success');
            
            // Visual feedback on button
            const originalText = btnCopy.innerHTML;
            btnCopy.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            setTimeout(() => {
                btnCopy.innerHTML = originalText;
            }, 2000);
        });

        // Download Markdown
        btnDownload.addEventListener('click', () => {
            const markdownText = resultBox.value;
            if (!markdownText) return;

            const blob = new Blob([markdownText], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const originalName = currentFile ? currentFile.name.split('.').slice(0, -1).join('.') : 'document';
            a.href = url;
            a.download = `${originalName}.md`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Toast Notification
        function showToast(message, type = 'success') {
            toastMsg.textContent = message;
            
            if (type === 'error') {
                toast.classList.add('error');
                toastIcon.className = 'fa-solid fa-circle-exclamation';
            } else {
                toast.classList.remove('error');
                toastIcon.className = 'fa-solid fa-circle-check';
            }

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
